backend:
  name: git-gateway
  repo: platstarinum-prog/thumbn
  branch: main

media_folder: "project/public/images/uploads"
public_folder: "/images/uploads"

collections:
  # Настройка для блока SELECTED WORKS
  - name: "selected_works"
    label: "Selected Works (Карточки)"
    folder: "project/src/content/works"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Название проекта (Title)", name: "title", widget: "string" }
      - { label: "Ссылка на YouTube", name: "url", widget: "string", required: false } # <-- НОВОЕ ПОЛЕ
      - { label: "Превью (Image)", name: "img", widget: "image" }
      - { label: "Тег (Категория)", name: "category", widget: "select", options: ["Tech", "Gaming", "Finance", "Lifestyle", "Education"] }
      - { label: "Просмотры (Views)", name: "views", widget: "string" }
      - { label: "Цвет акцента (HEX, например: #a855f7)", name: "accent", widget: "string" }

  # Настройка для блока BEFORE / AFTER
  - name: "before_after"
    label: "Before / After (Слайдеры)"
    folder: "project/src/content/before-after"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Название (Label)", name: "label", widget: "string" }
      - { label: "Картинка ДО (Before)", name: "before", widget: "image" }
      - { label: "Картинка ПОСЛЕ (After)", name: "after", widget: "image" }

  # Настройка для блока PRICING
  - name: "pricing"
    label: "Pricing (Тарифы)"
    folder: "project/src/content/pricing"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Иконка", name: "icon", widget: "select", options: ["Zap", "Package", "Repeat"] }
      - { label: "Название (Name)", name: "name", widget: "string" }
      - { label: "Цена (Price)", name: "price", widget: "string" }
      - { label: "Период (Period)", name: "period", widget: "string" }
      - { label: "Описание (Description)", name: "description", widget: "string" }
      - { label: "Список фич (Features)", name: "features", widget: "list" }
      - { label: "Цвет акцента (HEX)", name: "accent", widget: "string" }
      - { label: "Популярный (Popular)", name: "popular", widget: "boolean", default: false }
